<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Shopping Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .auth-card {
            background: #334155;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            color: var(--primary-color);
            margin: 0 0 0.5rem 0;
            font-size: 1.8rem;
        }

        body.dark-mode .auth-header h1 {
            color: #60a5fa;
        }

        .auth-header p {
            color: #6b7280;
            margin: 0;
        }

        body.dark-mode .auth-header p {
            color: #9ca3af;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1f2937;
        }

        body.dark-mode label {
            color: #e5e7eb;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body.dark-mode input[type="text"],
        body.dark-mode input[type="email"],
        body.dark-mode input[type="password"] {
            background: #475569;
            color: white;
            border-color: #64748b;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--primary-color) 0%, #1e40af 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(37, 99, 235, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--danger-color);
        }

        body.dark-mode .error {
            background: #7f1d1d;
            color: #fecaca;
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b7280;
        }

        body.dark-mode .auth-link {
            color: #9ca3af;
        }

        .auth-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        body.dark-mode .auth-link a {
            color: #60a5fa;
        }

        .auth-link a:hover {
            opacity: 0.8;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--secondary-color);
        }

        body.dark-mode .success-message {
            background: #064e3b;
            color: #86efac;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 2rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        body.dark-mode .back-home {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <header style="position: relative;">
        <h1 style="margin-bottom: 0;">🛍️ Smart Shopping Assistant</h1>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()" style="position: absolute; top: 1rem; right: 1rem;">🌙 Dark Mode</button>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back!</h1>
                    <p>Sign in to your account</p>
                </div>

                {% if request.args.get('success') %}
                <div class="success-message">
                    ✓ Registration successful! Please log in with your credentials.
                </div>
                {% endif %}

                {% if error %}
                <div class="error">
                    ⚠️ {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="submit-btn">🔐 Login</button>
                </form>

                <div class="auth-link">
                    Don't have an account? <a href="/register">Register here</a>
                </div>

                <a href="/" class="back-home">← Back to Home</a>
            </div>
        </div>
    </main>

    <script>
        function toggleDarkMode() {
            const body = document.body;
            body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', body.classList.contains('dark-mode'));
        }

        // Load dark mode preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
