<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Smart Shopping Assistant</h1>
        <p>Find the best products based on value, not popularity.</p>
    </header>
    <main>
        <form action="/search" method="post">
            <input type="text" name="query" placeholder="Enter product name, e.g., shampoo" required>
            <button type="submit">Search</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
    </main>
</body>
</html>
